# egress redline rule set -- the single source shared by CAP egress and the LED evidence exit (config points to it, redact consumes it).
# Each entry = one named regex; redact replaces the whole match with [REDACTED:<category>:<name>].
# Over-redaction is the safe side (better to drop too much); add new rules here alone, do not scatter them across the code.

[[secret]]
name = "aws_access_key_id"
pattern = '''AKIA[0-9A-Z]{16}'''

[[secret]]
name = "private_key_block"
# the whole block, not just its header (PEM and PGP armor): through its END when that comes within 8 KiB
# and before another BEGIN or the next record (a line starting `{` in a capture window, `user: ` or
# `assistant: ` in a digest); otherwise (a record clipped mid-key) the rest of that record, whatever its
# lines look like: a body line can carry spaces, so telling it from prose is guesswork. Only `\n` ends
# a line; a `\r` (CRLF, or `\r\r\n` that openssl still reads) is part of it.
# Possessive runs (3.11+) keep the clipped branch linear.
pattern = '''-----BEGIN [A-Z ]*PRIVATE KEY(?: BLOCK)?-----(?:(?:(?!-----BEGIN |\n(?:\{|(?:user|assistant): ))[\s\S]){0,8192}?-----END [A-Z ]*PRIVATE KEY(?: BLOCK)?-----|[^\n]*+(?:\n(?!\{|(?:user|assistant): )[^\n]*+)*+)'''

[[secret]]
name = "github_token"
pattern = '''gh[posru]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{22,}'''

[[secret]]
name = "slack_token"
pattern = '''xox[abprs]-[A-Za-z0-9-]{10,}'''

[[secret]]
name = "bearer_token"
pattern = '''(?i)bearer\s+[A-Za-z0-9._-]{20,}'''

[[secret]]
name = "api_key_assignment"
# the key may itself be quoted ("api_key": ...), and inside a JSONL transcript record the quotes arrive
# backslash-escaped (\"api_key\": \"...\"), so allow an optional (escaped) quote after the key and before the value.
# secret[_-]?key covers names such as AWS_SECRET_ACCESS_KEY and STRIPE_SECRET_KEY, where "secret" is not the last word.
pattern = '''(?i)(api[_-]?key|secret(?:[_-]?access)?[_-]?key|secret|token|password)(?:\\?['"])?\s*[:=]\s*(?:\\?['"])?[A-Za-z0-9._\-/+]{12,}'''

# Keys with a recognizable vendor prefix are matched on their own shape, so they are redacted when they
# appear bare in prose or a log line, not only when assigned to a variable the rule above can see. These come
# after api_key_assignment on purpose: an assignment keeps reporting itself as api_key_assignment (first match
# wins), and these rules cover the keys that appear outside one.
# The left guard keeps ordinary hyphenated words (risk-, task-, disk-) from starting a match.
[[secret]]
name = "stripe_key"
pattern = '''(?<![A-Za-z0-9])[sr]k_(?:live|test)_[A-Za-z0-9]{16,}'''

# listed before openai_api_key: an sk-ant- key would also fit the shorter sk- shape, and the first match wins
[[secret]]
name = "anthropic_api_key"
pattern = '''(?<![A-Za-z0-9])sk-ant-[A-Za-z0-9_-]{20,}'''

[[secret]]
name = "openai_api_key"
pattern = '''(?<![A-Za-z0-9])sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{32,}'''

[[secret]]
name = "google_api_key"
pattern = '''(?<![A-Za-z0-9])AIza[0-9A-Za-z_-]{35}'''

[[secret]]
name = "npm_token"
pattern = '''(?<![A-Za-z0-9])npm_[A-Za-z0-9]{36}'''

# header and payload both start with eyJ (base64 of `{"`)
[[secret]]
name = "jwt"
pattern = '''eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'''

[[pii]]
name = "email"
pattern = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''

[[pii]]
name = "ssn"
pattern = '''(?<!\d)\d{3}-\d{2}-\d{4}(?!\d)'''

[[pii]]
name = "us_phone"
pattern = '''(?<!\d)(\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}(?!\d)'''

[[pii]]
name = "credit_card"
pattern = '''(?<!\d)(?:\d[ -]?){13,16}(?!\d)'''
# luhn gate: 13-16 digit runs failing the checksum (snowflake ids, ms timestamps, numeric pks)
# stay in the stream as evidence; real card numbers pass by construction.
validate = "luhn"
